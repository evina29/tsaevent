<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delaware TSA Self-Scorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* One question per screen, big answer blocks lettered like a bubble sheet. Single dark blue look on purpose. */
:root {
  color-scheme: dark;
  --bg: #14306b;
  --bg-deep: #0e2250;
  --ink: #ffffff;
  --muted: #b8c6e8;
  --buff: #ff2e44;
  --redtext: #ff6b78;
  --buff-ink: #ffffff;
  --card: #ffffff;
  --card-ink: #14306b;
  --card-muted: #4a5b86;
  --line: #3a528f;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Barlow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 56px; min-height: 100%; }
.wrap { max-width: 720px; margin-inline: auto; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-bottom: 14px; border-bottom: 2px solid var(--line); margin-bottom: 28px; }
.top b { color: var(--redtext); font-weight: 700; }
h1, h2 { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .98; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(48px, 12vw, 92px); }
h1 span { color: var(--redtext); }
h2 { font-size: clamp(32px, 7vw, 50px); }
p { margin: 0; }
.intro { display: flex; flex-direction: column; gap: 22px; align-items: flex-start; }
.intro p { color: var(--muted); max-width: 46ch; font-size: 19px; }
.go { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .05em; text-transform: uppercase; background: var(--buff); color: var(--buff-ink); border: 0; padding: 14px 34px; cursor: pointer; }
.go:hover { background: #ff5468; }
button:focus-visible { outline: 3px solid var(--redtext); outline-offset: 3px; }
.steps { display: flex; gap: 5px; margin-bottom: 22px; }
.steps i { flex: 1; height: 6px; background: var(--line); }
.steps i.done { background: var(--buff); }
.qnum { font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: var(--redtext); margin-bottom: 8px; }
.answers { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }
.ans { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: stretch; text-align: left; font: inherit; font-weight: 500; font-size: 18px; background: var(--card); color: var(--card-ink); border: 0; padding: 0; cursor: pointer; }
.ans .l { display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 24px; background: var(--buff); color: var(--buff-ink); }
.ans .t { padding: 13px 16px; }
.ans:hover .l, .ans.picked .l { background: var(--card-ink); color: var(--redtext); }
.ans.picked { outline: 3px solid var(--redtext); }
.nav { margin-top: 22px; display: flex; gap: 14px; align-items: center; }
.link { font: inherit; background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px 0; font-size: 16px; }
.link:hover { color: #fff; }
.res-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 26px; }
.res-head p { color: var(--muted); }
.results { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.r { display: grid; grid-template-columns: 56px minmax(0, 1fr); background: var(--card); color: var(--card-ink); }
.r .n { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; display: flex; align-items: flex-start; justify-content: center; padding-top: 12px; background: var(--buff); color: var(--buff-ink); }
.r .b { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.r h3 { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.05; text-transform: uppercase; margin: 0; }
.r .why { font-weight: 600; font-size: 15px; }
.r .what { color: var(--card-muted); font-size: 16px; }
.r .facts { font-size: 14px; color: var(--card-muted); border-top: 1px solid #d3dbef; padding-top: 6px; margin-top: 2px; }
.more { margin-top: 30px; }
.more h3 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; color: var(--redtext); margin: 0 0 8px; }
.more ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
.more li { border: 2px solid var(--line); padding: 5px 12px; font-size: 16px; }
.note { margin-top: 32px; padding-top: 16px; border-top: 2px solid var(--line); color: var(--muted); font-size: 15px; display: flex; flex-direction: column; gap: 8px; }
.note a { color: var(--redtext); }

.brand { display: flex; align-items: center; gap: 14px; }
.logo { height: 48px; width: auto; display: block; background: #fff; padding: 3px 5px; }
.top { flex-wrap: wrap; }
.brand { min-width: 0; }
@media (max-width: 520px) {
  body { font-size: 16px; padding-inline: 14px; }
  .top { font-size: 15px; gap: 8px; }
  .logo { height: 38px; }
  .intro p { font-size: 17px; }
  .go { font-size: 22px; padding: 12px 28px; }
  .ans { grid-template-columns: 38px minmax(0, 1fr); font-size: 17px; }
  .ans .t { padding: 12px 14px; }
  .r { grid-template-columns: 44px minmax(0, 1fr); }
  .r .n { font-size: 34px; }
  .r h3 { font-size: 24px; }
  .r .b { padding: 12px 14px 14px; }
}
.all { display: flex; flex-direction: column; }
.all div { border-top: 2px solid var(--line); padding: 10px 0; }
.all b { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; display: block; }
.all span { color: var(--muted); }
.search { width: 100%; font: inherit; font-size: 18px; padding: 12px 14px; margin: 26px 0 14px; background: var(--card); color: var(--card-ink); border: 0; border-radius: 0; }
.evgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.evbtn { text-align: left; font: inherit; background: var(--card); color: var(--card-ink); border: 0; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; border-left: 8px solid var(--buff); }
.evbtn:hover { background: #e8eefc; }
.evbtn .en { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; text-transform: uppercase; }
.evbtn .em { font-size: 14px; color: var(--card-muted); }
.empty { color: var(--muted); }
.evtitle { margin: 6px 0 16px; }
.sumbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg-deep); border-bottom: 3px solid var(--buff); padding: 10px 0 8px; margin-bottom: 16px; }
.sumbig { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; color: #fff; }
.sumsmall { color: var(--muted); font-size: 15px; margin-top: 2px; }
.info { background: var(--bg-deep); border-left: 6px solid var(--buff); padding: 10px 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 2px; }
.info b { font-family: var(--display); font-size: 18px; letter-spacing: .05em; text-transform: uppercase; color: var(--redtext); }
.info span { color: #e6ecfb; font-size: 16px; }
.howto { color: var(--muted); font-size: 16px; margin: 0 0 16px; }
.formname { font-family: var(--display); font-weight: 800; font-size: 28px; text-transform: uppercase; margin: 26px 0 8px; color: var(--redtext); }
.sec { margin-bottom: 22px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
.sechead h4 { font-family: var(--display); font-weight: 800; font-size: 26px; text-transform: uppercase; margin: 0; line-height: 1.05; }
.subt { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--buff-ink); background: var(--buff); padding: 2px 10px; white-space: nowrap; }
.crit { background: var(--card); color: var(--card-ink); padding: 12px 14px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
.ctop { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.ctop b { font-size: 17px; }
.mult { font-family: var(--display); font-weight: 800; font-size: 18px; background: var(--card-ink); color: #fff; padding: 0 8px; }
.chint { font-size: 14px; color: var(--card-muted); }
.scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.scale:has(button:first-child:nth-last-child(11)) { grid-template-columns: repeat(11, minmax(0, 1fr)); }
.rb { font: inherit; font-weight: 600; font-size: 16px; padding: 9px 0; background: #e3e9f7; color: var(--card-ink); border: 0; cursor: pointer; }
.rb:hover { background: #cdd8f3; }
.rb.on { background: var(--buff); color: var(--buff-ink); }
.band { font-size: 14px; font-weight: 600; color: var(--card-muted); }
.crit.done .band { color: var(--card-ink); }
.improve { margin-top: 26px; }
.improve h3 { font-family: var(--display); font-weight: 800; font-size: 28px; text-transform: uppercase; margin: 0 0 10px; color: var(--redtext); }
.gain { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.gain li { background: var(--card); color: var(--card-ink); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.gain li span { font-size: 14px; color: var(--card-muted); }
@media (max-width: 520px) {
  .evgrid { grid-template-columns: minmax(0, 1fr); }
  .scale, .scale:has(button:first-child:nth-last-child(11)) { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .rb { padding: 12px 0; }
  .sumbig { font-size: 30px; }
}
</style>

ame","m":1,"h":"Well-organized game flowing smoothly between scenes or levels"},{"n":"Overall Appeal","m":2,"h":"Innovative, entertaining, easy and enjoyable to play"}]},{"n":"Preliminary Video Demonstration & Documentation Portfolio","p":50,"c":[{"n":"Video Game Demonstration","m":1,"h":"Well-organized demo video with every required component"},{"n":"Portfolio Components","m":1,"h":"All components present with excellent content and order"},{"n":"Game Directions and Control Function","m":1,"h":"Easy-to-follow directions and well-matched controls"},{"n":"Work Log","m":1,"h":"Complete log showing every member's participation"},{"n":"Storyboard","m":1,"h":"Complete, concise, neat storyboard following the game's flow"}]},{"n":"Semifinal Interview","p":40,"c":[{"n":"Organization","m":1,"h":"Logical, well-organized, concise game explanation"},{"n":"Team Participation","m":1,"h":"All members actively involved with shared responsibility"},{"n":"Knowledge","m":1,"h":"Clear, thorough understanding of their project"},{"n":"Articulation","m":1,"h":"Clear, concise design-process communication showing leadership skills"}]}]},{"n":"Bonus (judges may add up to 10 points)","p":10,"s":[{"n":"Bonus","p":10,"c":[{"n":"Bonus Points - Unique and exceptional features","m":1,"h":"Outstanding, unique game features or strong educational value"}]}]}],"p":"5-point deduction if game plays under 3 minutes or demo video exceeds 5 minutes; 20% rules-violation deduction.","o":""},{"n":"Virtual Reality Simulation (VR)","t":"rubric","f":[{"n":"Rating form (preliminary and semifinal)","p":200,"s":[{"n":"Tier 1 - Simulation","p":90,"c":[{"n":"Communication of Simulation","m":1,"h":"Concept presented in an organized, clear, concise way"},{"n":"Creativity","m":1,"h":"Highly creative with design principles integrated"},{"n":"Aesthetics and Artisanship","m":1,"h":"Exemplary layout and design that communicates data logically"},{"n":"Graphical Representations","m":2,"h":"Excellent graphics that clarify abstract concepts"},{"n":"Video","m":1,"h":"High-quality video that clarifies abstract concepts"},{"n":"Sound Integration","m":1,"h":"High-quality sound that enhances the project"},{"n":"Originality","m":1,"h":"Inspiring, inventive, resourceful simulation"},{"n":"VR","m":1,"h":"Fully uses VR elements and demonstrates hardware integration well"}]},{"n":"Tier 2 - Documentation Portfolio","p":50,"c":[{"n":"Portfolio Components","m":1,"h":"All components present, well organized"},{"n":"Purpose","m":1,"h":"Purpose is clear, concise, and compelling"},{"n":"Storyboard","m":2,"h":"Exceptional storyboard clearly matching the simulation, including timings"},{"n":"Work Log","m":1,"h":"Complete, accurate log capturing collaboration and edits"}]},{"n":"Semifinal Presentation/Interview","p":60,"c":[{"n":"VR Simulation","m":2,"h":"Uses VR hardware effectively, simulation enhanced by VR features"},{"n":"Organization","m":1,"h":"Well prepared; answers judges' questions concisely"},{"n":"Knowledge","m":2,"h":"Clear evidence of thorough topic understanding"},{"n":"Delivery","m":1,"h":"Well-spoken, polished delivery with good posture and eye contact"}]}]}],"p":"20% rules-violation deduction; 5 points off per 15 seconds the simulation is under 2 minutes or over 3 minutes; 5-point deduction for exceeding semifinal interview time.","o":""},{"n":"Webmaster","t":"rubric","f":[{"n":"Rating form (preliminary and semifinal)","p":180,"s":[{"n":"Preliminary Website","p":130,"c":[{"n":"Theme","m":2,"h":"Annual theme addressed and carried through supporting pages"},{"n":"Challenge","m":3,"h":"Well-researched, highly effective solution with all components and helpful extras"},{"n":"Content","m":2,"h":"Content fits the site's purpose and adds to its effectiveness"},{"n":"Layout and Navigation","m":2,"h":"Exceptionally user-friendly layout with intuitive navigation"},{"n":"Graphics and Color Scheme","m":2,"h":"High-quality graphics and attractive color scheme that enhance the experience"},{"n":"Function a var screen = document.getElementById("screen"), status = document.getElementById("status");
var cur = null, rate = {}, ui = null;

function h(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function clear() { screen.innerHTML = ""; }
function band(v) { return v === 0 ? "No bonus" : v <= 4 ? "Minimal" : v <= 8 ? "Adequate" : "Exemplary"; }
function isBonus(f, s) { return /bonus/i.test(f.n) || /bonus/i.test(s.n); }
function rubricMax(e) { var t = 0; e.f.forEach(function (f) { f.s.forEach(function (s) { s.c.forEach(function (c) { t += 10 * c.m; }); }); }); return t; }
function label(e) {
  var m = rubricMax(e);
  if (!m) return "No rubric. Scored by test or placement.";
  return e.t === "rubric" ? "Rubric, " + m + " points" : "Rubric (" + m + " pts) plus test or placement points";
}
function key(i) { return "de-tsa-scorer-v1:" + DATA[i].n; }
function load(i) { try { return JSON.parse(localStorage.getItem(key(i)) || "{}") || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(key(cur), JSON.stringify(rate)); } catch (e) {} }
function link(parent, text, href) { var a = h("a", null, text); a.href = href; a.target = "_blank"; a.rel = "noopener"; parent.appendChild(a); }

function home() {
  cur = null; status.textContent = "Self-scorer"; clear();
  var d = h("div", "intro");
  var t = h("h1"); t.appendChild(document.createTextNode("Score your ")); t.appendChild(h("span", null, "project")); d.appendChild(t);
  d.appendChild(h("p", null, "Pick your event, rate yourself from 1 to 10 on each thing the judges score, and see your total and where you can gain the most points."));
  screen.appendChild(d);
  var q = h("input", "search"); q.type = "search"; q.id = "q"; q.placeholder = "Search events"; q.setAttribute("aria-label", "Search events"); screen.appendChild(q);
  var grid = h("div", "evgrid"); screen.appendChild(grid);
  function fill() {
    grid.innerHTML = ""; var s = q.value.trim().toLowerCase(), n = 0;
    DATA.forEach(function (e, i) {
      if (s && e.n.toLowerCase().indexOf(s) < 0) return; n++;
      var b = h("button", "evbtn"); b.type = "button";
      b.appendChild(h("span", "en", e.n)); b.appendChild(h("span", "em", label(e)));
      b.onclick = function () { show(i); }; grid.appendChild(b);
    });
    if (!n) grid.appendChild(h("p", "empty", "No events match that search."));
  }
  q.oninput = fill; fill();
  var note = h("div", "note");
  note.appendChild(h("p", null, "Based on the 2025–2026 TSA High School Competitive Events Guide. Rating forms can change from year to year, so check the current guide before your conference. These events are on the 2027 and 2028 list but aren’t in that guide, so they aren’t here yet: Artificial Intelligence, Automated Manufacturing Systems, Cybersecurity, Hybrid Racer XL, and Vlogging."));
  var p2 = h("p"); p2.appendChild(document.createTextNode("Official events: ")); link(p2, "tsaweb.org/competitions", "https://tsaweb.org/competitions");
  p2.appendChild(document.createTextNode(" · Delaware TSA: ")); link(p2, "detsa.org", "https://detsa.org");
  note.appendChild(p2); screen.appendChild(note);
  window.scrollTo(0, 0);
}

function show(i) { cur = i; rate = load(i); build(); window.scrollTo(0, 0); }

function build() {
  var e = DATA[cur]; clear(); status.textContent = "Self-scorer";
  var back = h("button", "link", "← All events"); back.type = "button"; back.onclick = home; screen.appendChild(back);
  screen.appendChild(h("h2", "evtitle", e.n));
  var crits = [], secs = [];
  var summary = h("div", "sumbar"); var sumMain = h("div", "sumbig"), sumSub = h("div", "sumsmall"); summary.appendChild(sumMain); summary.appendChild(sumSub);
  var hasRubric = rubricMax(e) > 0;
  if (hasRubric) screen.appendChild(summary);
  if (e.o) { var o = h("div", "info"); o.appendChild(h("b", null, "How the rest is scored")); o.appendChild(h("span", null, e.o)); screen.appendChild(o); }
  if (e.p) { var p = h("div", "info"); p.appendChild(h("b", null, "Deductions to watch for")); p.appendChild(h("span", null, e.p)); screen.appendChild(p); }
  if (hasRubric) screen.appendChild(h("p", "howto", "Rate each item from 1 to 10. Judges use 1 to 4 for minimal, 5 to 8 for adequate, and 9 to 10 for exemplary. The number in the corner is how much the item counts."));

  e.f.forEach(function (f, fi) {
    var hasC = f.s.some(function (s) { return s.c.length; });
    if (!hasC) {
      f.s.forEach(function (s) { var d = h("div", "info"); d.appendChild(h("b", null, s.n + " (" + s.p + " points)")); d.appendChild(h("span", null, "Scored by test or placement, not by a rubric.")); screen.appendChild(d); });
      return;
    }
    if (e.f.length > 1) screen.appendChild(h("h3", "formname", f.n));
    f.s.forEach(function (s, si) {
      if (!s.c.length) { var d = h("div", "info"); d.appendChild(h("b", null, s.n + " (" + s.p + " points)")); d.appendChild(h("span", null, "Scored by test or placement, not by a rubric.")); screen.appendChild(d); return; }
      var sec = h("section", "sec"); var head = h("div", "sechead"); head.appendChild(h("h4", null, s.n)); var sub = h("span", "subt"); head.appendChild(sub); sec.appendChild(head);
      var so = { sub: sub, items: [] }; secs.push(so);
      var bonus = isBonus(f, s);
      s.c.forEach(function (c, ci) {
        var id = fi + "." + si + "." + ci, row = h("div", "crit");
        var top = h("div", "ctop"); top.appendChild(h("b", null, c.n)); top.appendChild(h("span", "mult", "×" + c.m)); row.appendChild(top);
        if (c.h) row.appendChild(h("div", "chint", "Top score: " + c.h));
        var sc = h("div", "scale"); sc.setAttribute("role", "group"); sc.setAttribute("aria-label", "Rating for " + c.n);
        var btns = [];
        for (var v = bonus ? 0 : 1; v <= 10; v++) {
          (function (v) {
            var b = h("button", "rb", String(v)); b.type = "button";
            b.onclick = function () { rate[id] = v; save(); paint(); };
            sc.appendChild(b); btns.push({ b: b, v: v });
          })(v);
        }
        row.appendChild(sc); var bd = h("div", "band"); row.appendChild(bd);
        var it = { id: id, m: c.m, n: c.n, h: c.h, btns: btns, bd: bd, row: row }; crits.push(it); so.items.push(it);
        sec.appendChild(row);
      });
      screen.appendChild(sec);
    });
  });

  var imp = h("div", "improve"); if (hasRubric) screen.appendChild(imp);
  var nav = h("div", "nav");
  var clr = h("button", "link", "Clear my scores"); clr.type = "button"; clr.onclick = function () { rate = {}; save(); paint(); }; if (hasRubric) nav.appendChild(clr);
  var all = h("button", "go", "Pick another event"); all.type = "button"; all.onclick = home; nav.appendChild(all);
  screen.appendChild(nav);
  var note = h("div", "note"); note.appendChild(h("p", null, "Your ratings are saved in this browser on this device. Based on the 2025–2026 TSA High School Competitive Events Guide, so check the current guide before your conference."));
  screen.appendChild(note);

  function paint() {
    var got = 0, max = 0, rated = 0;
    crits.forEach(function (c) {
      var v = rate[c.id], has = v !== undefined;
      c.btns.forEach(function (x) { x.b.className = "rb" + (has && x.v === v ? " on" : ""); x.b.setAttribute("aria-pressed", has && x.v === v ? "true" : "false"); });
      c.bd.textContent = has ? band(v) + " · " + (v * c.m) + " of " + (10 * c.m) + " points" : "Not rated yet";
      c.row.className = "crit" + (has ? " done" : "");
      max += 10 * c.m; if (has) { got += v * c.m; rated++; }
    });
    secs.forEach(function (s) {
      var g = 0, m = 0; s.items.forEach(function (c) { m += 10 * c.m; if (rate[c.id] !== undefined) g += rate[c.id] * c.m; });
      s.sub.textContent = g + " of " + m;
    });
    sumMain.textContent = got + " of " + max + " points";
    sumSub.textContent = "Rated " + rated + " of " + crits.length + (rated && rated < crits.length ? " · unrated items count as 0" : "") + (max ? " · " + Math.round(got / max * 100) + "%" : "");
    imp.innerHTML = "";
    var list = crits.filter(function (c) { return rate[c.id] !== undefined && rate[c.id] < 10; }).map(function (c) { return { c: c, gain: (10 - rate[c.id]) * c.m }; });
    list.sort(function (a, b) { return b.gain - a.gain; });
    if (rated >= 3 && list.length) {
      imp.appendChild(h("h3", null, "Where to gain the most points"));
      var ul = h("ol", "gain");
      list.slice(0, 5).forEach(function (x) {
        var li = h("li"); li.appendChild(h("b", null, x.c.n + " (up to +" + x.gain + ")"));
        if (x.c.h) li.appendChild(h("span", null, "Top score: " + x.c.h));
        ul.appendChild(li);
      });
      imp.appendChild(ul);
    } else if (rated < 3) { imp.appendChild(h("p", "howto", "Rate at least three items to see where you can gain the most points.")); }
  }
  paint();
}
home();
</script>
